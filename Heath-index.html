<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>TG Reach - 维护中</title>
  <style>
    :root{
      --bg0:#060812;
      --bg1:#0b1022;
      --c1:#00d2ff;
      --c2:#7a5cff;
      --c3:#00ffa8;
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.72);
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --shadow: 0 20px 80px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(0,210,255,.18), transparent 60%),
        radial-gradient(900px 500px at 85% 20%, rgba(122,92,255,.18), transparent 60%),
        radial-gradient(900px 500px at 50% 90%, rgba(0,255,168,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
    }

    /* 背景粒子 */
    .bg{
      position:fixed;
      inset:0;
      pointer-events:none;
      filter: saturate(1.1);
    }
    .orb{
      position:absolute;
      width:420px;height:420px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 55%),
                  radial-gradient(circle at 70% 70%, rgba(255,255,255,.10), transparent 60%),
                  conic-gradient(from 220deg, rgba(0,210,255,.35), rgba(122,92,255,.30), rgba(0,255,168,.25), rgba(0,210,255,.35));
      mix-blend-mode:screen;
      opacity:.55;
      animation: float 10s ease-in-out infinite;
      filter: blur(0.2px);
    }
    .orb:nth-child(1){left:-120px;top:-120px;animation-duration: 12s}
    .orb:nth-child(2){right:-160px;top:10%;width:520px;height:520px;opacity:.45;animation-duration: 14s;animation-delay:-4s}
    .orb:nth-child(3){left:10%;bottom:-180px;width:560px;height:560px;opacity:.38;animation-duration: 16s;animation-delay:-7s}

    @keyframes float{
      0%,100%{transform: translate3d(0,0,0) scale(1)}
      50%{transform: translate3d(0,28px,0) scale(1.04)}
    }

    .grid{
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity:.12;
      transform: perspective(800px) rotateX(58deg) translateY(-18%);
      transform-origin: top;
      mask-image: radial-gradient(circle at 50% 25%, rgba(0,0,0,1), rgba(0,0,0,.2) 55%, transparent 80%);
    }

    .scan{
      position:absolute; inset:-40%;
      background: linear-gradient(120deg, transparent 35%, rgba(0,210,255,.10), transparent 65%);
      animation: scan 8s linear infinite;
      opacity:.55;
    }
    @keyframes scan{
      0%{transform: translateX(-30%) translateY(-20%)}
      100%{transform: translateX(30%) translateY(20%)}
    }

    .wrap{
      position:relative;
      height:100%;
      display:grid;
      place-items:center;
      padding: 28px 18px;
    }

    .card{
      width:min(980px, 100%);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-1px;
      background: radial-gradient(900px 420px at 10% 0%, rgba(0,210,255,.22), transparent 55%),
                  radial-gradient(900px 420px at 90% 0%, rgba(122,92,255,.20), transparent 55%),
                  radial-gradient(900px 520px at 50% 120%, rgba(0,255,168,.12), transparent 55%);
      opacity:.9;
      pointer-events:none;
    }

    .inner{
      position:relative;
      padding: 34px 34px 30px;
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 26px;
      align-items:center;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom: 14px;
    }
    .logo{
      width:42px;height:42px;border-radius:14px;
      background: linear-gradient(135deg, rgba(0,210,255,.95), rgba(122,92,255,.95));
      box-shadow: 0 10px 40px rgba(0,210,255,.18);
      position:relative;
      overflow:hidden;
    }
    .logo::after{
      content:"";
      position:absolute; inset:-60%;
      background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.28), transparent 65%);
      animation: scan 6.8s linear infinite;
      opacity:.85;
    }
    .brand h1{
      margin:0;
      font-size: 1.05rem;
      letter-spacing: .02em;
      color: rgba(234,240,255,.92);
      font-weight: 700;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,210,255,.10);
      border: 1px solid rgba(0,210,255,.20);
      color: rgba(234,240,255,.90);
      font-size: .92rem;
      width: fit-content;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--c1);
      box-shadow: 0 0 0 6px rgba(0,210,255,.18);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{transform: scale(1); opacity: 1}
      50%{transform: scale(1.06); opacity: .85}
    }

    .title{
      margin: 14px 0 10px;
      font-size: clamp(2.1rem, 4.2vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .title .shine{
      background: linear-gradient(90deg, rgba(234,240,255,1), rgba(0,210,255,.95), rgba(122,92,255,.95), rgba(234,240,255,1));
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 5.5s ease-in-out infinite;
    }
    @keyframes shimmer{
      0%,100%{background-position: 0% 50%}
      50%{background-position: 100% 50%}
    }

    .desc{
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
      max-width: 52ch;
    }

    .actions{
      display:flex;
      gap: 12px;
      flex-wrap:wrap;
      margin-top: 16px;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius: 14px;
      padding: 12px 14px;
      color: rgba(234,240,255,.92);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      cursor:pointer;
      font-weight: 650;
      display:inline-flex;
      align-items:center;
      gap:10px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      text-decoration:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22);}
    .btn.primary{
      background: linear-gradient(135deg, rgba(0,210,255,.95), rgba(122,92,255,.95));
      border-color: rgba(0,210,255,.25);
      box-shadow: 0 14px 50px rgba(0,210,255,.16);
    }
    .btn.primary:hover{background: linear-gradient(135deg, rgba(0,210,255,1), rgba(122,92,255,1));}

    .meta{
      margin-top: 14px;
      display:flex;
      gap: 14px;
      flex-wrap:wrap;
      color: rgba(234,240,255,.64);
      font-size: .92rem;
    }
    .meta span{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.10);
    }
    .meta b{color: rgba(234,240,255,.90); font-weight: 700;}

    /* 右侧状态区 */
    .status{
      border-radius: 18px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.12);
      padding: 18px;
      position:relative;
      overflow:hidden;
    }
    .status::before{
      content:"";
      position:absolute; inset:-1px;
      background: radial-gradient(420px 220px at 20% 20%, rgba(0,210,255,.20), transparent 60%),
                  radial-gradient(420px 220px at 90% 35%, rgba(122,92,255,.18), transparent 60%);
      opacity:.9;
      pointer-events:none;
    }
    .status-inner{position:relative}
    .status h2{
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: rgba(234,240,255,.92);
    }
    .bar{
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
      margin-bottom: 12px;
    }
    .bar > i{
      display:block;
      height:100%;
      width: 72%;
      background: linear-gradient(90deg, rgba(0,210,255,.95), rgba(122,92,255,.95), rgba(0,255,168,.75));
      background-size: 200% 100%;
      animation: bar 2.8s ease-in-out infinite;
      border-radius: 999px;
    }
    @keyframes bar{
      0%,100%{transform: translateX(-10%); background-position: 0% 50%}
      50%{transform: translateX(0%); background-position: 100% 50%}
    }
    .list{
      display:grid;
      gap:10px;
      margin:0;
      padding:0;
      list-style:none;
      color: rgba(234,240,255,.78);
      font-size: .95rem;
      line-height: 1.45;
    }
    .list li{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }
    .check{
      width:18px;height:18px; flex: 0 0 18px;
      border-radius: 6px;
      background: rgba(0,255,168,.16);
      border: 1px solid rgba(0,255,168,.25);
      position:relative;
      margin-top: 1px;
    }
    .check::after{
      content:"";
      position:absolute;
      left:5px; top:3px;
      width:6px; height:10px;
      border-right:2px solid rgba(0,255,168,.95);
      border-bottom:2px solid rgba(0,255,168,.95);
      transform: rotate(38deg);
    }

    .footer{
      margin-top: 18px;
      display:flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap:wrap;
      color: rgba(234,240,255,.55);
      font-size: .9rem;
      padding: 0 34px 28px;
      position:relative;
    }
    .footer > span:last-child{
      font-size: .88rem;
      color: rgba(234,240,255,.48);
    }
    .footer a{color: rgba(234,240,255,.78); text-decoration:none}
    .footer a:hover{color: rgba(0,210,255,.95)}

    /* 响应式 */
    @media (max-width: 920px){
      .inner{grid-template-columns: 1fr; padding: 28px 22px;}
      .footer{padding: 0 22px 22px;}
    }

    @media (prefers-reduced-motion: reduce){
      .orb,.scan,.logo::after,.title .shine,.bar>i,.dot{animation:none !important}
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="grid"></div>
    <div class="scan"></div>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="inner">
        <div>
          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <h1>TG Reach</h1>
          </div>

          <div class="pill">
            <span class="dot" aria-hidden="true"></span>
            系统维护中
          </div>

          <h2 class="title">
            我们正在为你
            <span class="shine">升级服务</span>
          </h2>
          <p class="desc">
            维护期间，部分功能可能暂不可用。我们会尽快恢复访问，感谢你的耐心等待。
          </p>

          <div class="actions">
            <button class="btn primary" type="button" id="retryBtn" aria-label="刷新重试">
              <span aria-hidden="true">↻</span>
              刷新重试
            </button>
            <a class="btn" href="https://www.douforge.com/" target="_blank" rel="noopener noreferrer">
              <span aria-hidden="true">⟵</span>
              返回官网
            </a>
          </div>

          <div class="meta" aria-label="状态信息">
            <span>状态：<b id="statusText">维护中</b></span>
            <span>时间：<b id="timeText">--:--</b></span>
            <span>更新：<b id="uptimeText">刚刚</b></span>
          </div>
        </div>

        <aside class="status" aria-label="维护说明">
          <div class="status-inner">
            <h2>正在处理</h2>
            <div class="bar" aria-hidden="true"><i></i></div>
            <ul class="list">
              <li><span class="check" aria-hidden="true"></span><span>发布新版本与热更新资源</span></li>
              <li><span class="check" aria-hidden="true"></span><span>优化下载与接口跨域策略</span></li>
              <li><span class="check" aria-hidden="true"></span><span>提升稳定性与访问速度</span></li>
            </ul>
          </div>
        </aside>
      </div>

      <div class="footer">
        <span>© <span id="year"></span> TG Reach</span>
        <span>如需帮助：<a href="https://www.douforge.com/" target="_blank" rel="noopener noreferrer">访问官网</a></span>
        <span>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2025145385号-3</a>
          <span aria-hidden="true">｜</span>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">公安备案中</a>
        </span>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const retryBtn = document.getElementById('retryBtn');
      const year = document.getElementById('year');
      const timeText = document.getElementById('timeText');
      const uptimeText = document.getElementById('uptimeText');
      const startedAt = Date.now();

      if (year) year.textContent = new Date().getFullYear();

      function pad(n){ return String(n).padStart(2,'0'); }
      function tick(){
        const d = new Date();
        if (timeText) timeText.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        const sec = Math.floor((Date.now() - startedAt) / 1000);
        if (uptimeText) uptimeText.textContent = sec < 60 ? (sec + 's') : (Math.floor(sec/60) + 'm ' + (sec%60) + 's');
      }
      tick();
      setInterval(tick, 1000);

      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          // 让用户看到按钮反馈，再刷新
          retryBtn.disabled = true;
          retryBtn.textContent = '正在刷新...';
          setTimeout(() => location.reload(), 350);
        });
      }
    })();
  </script>
</body>
</html>
